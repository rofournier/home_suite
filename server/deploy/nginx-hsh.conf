# Home Sweet Home — /etc/nginx/sites-available/hsh
# Écoute sur 8443 (HTTPS) pour ne pas toucher à vivavoce (443).
# Réutilise le certificat Let's Encrypt existant du VPS.

upstream hsh_app {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name vps-3edc37a3.vps.ovh.net;

    ssl_certificate     /etc/letsencrypt/live/vps-3edc37a3.vps.ovh.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps-3edc37a3.vps.ovh.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/hsh.access.log;
    error_log  /var/log/nginx/hsh.error.log;

    # WebSocket temps réel (wss://…:8443/realtime?token=…)
    location /realtime {
        proxy_pass         http://hsh_app;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;

        # Connexions longues : ne pas couper le socket au bout de 60s.
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    location / {
        proxy_pass         http://hsh_app;
        proxy_http_version 1.1;

        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Upload de photos (documents / plantes / galerie).
        client_max_body_size 25m;
    }
}
